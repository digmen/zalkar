worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 8080;  # Используем порт 80 для прослушивания

        server_name plfinal.site;  # Указываем правильный домен или оставляем как есть для тестирования
        root /usr/share/nginx/html; 

        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
